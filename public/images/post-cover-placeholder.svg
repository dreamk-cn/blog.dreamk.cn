<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" fill="none" role="img" aria-label="cover-placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4F46E5"/>
      <stop offset="0.55" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="shine" x1="400" y1="0" x2="400" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="800" height="320" fill="url(#bg)"/>
  <rect width="800" height="320" fill="url(#dots)"/>
  <ellipse cx="620" cy="80" rx="160" ry="100" fill="#FFFFFF" fill-opacity="0.08"/>
  <ellipse cx="160" cy="240" rx="180" ry="90" fill="#312E81" fill-opacity="0.35"/>
  <rect width="800" height="320" fill="url(#shine)"/>
  <!-- ?????? y=160????? (0,0) ????? -->
  <g transform="translate(400 160)">
    <rect x="-88" y="-56" width="176" height="112" rx="14" fill="#FFFFFF" fill-opacity="0.18" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="2"/>
    <circle cx="-36" cy="-12" r="16" fill="#FFFFFF" fill-opacity="0.85"/>
    <path d="M-72 40 L-8 -8 L32 20 L72 40" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
